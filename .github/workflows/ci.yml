name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Cargo build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install SQLite on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes sqlite3

      - name: Install SQLite on macOS
        if: runner.os == 'macOS'
        run: |
          brew install sqlite
          echo "$(brew --prefix sqlite)/bin" >> "$GITHUB_PATH"

      - name: Build the loadable extension
        run: cargo build -p cr-sqlite --release --locked

      - name: Locate the Cargo artifact
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              artifact="$PWD/target/release/libcrsqlite.so"
              dist="$PWD/core/dist/crsqlite.so"
              ;;
            macOS)
              artifact="$PWD/target/release/libcrsqlite.dylib"
              dist="$PWD/core/dist/crsqlite.dylib"
              ;;
            *)
              echo "Unsupported runner: $RUNNER_OS" >&2
              exit 1
              ;;
          esac

          test -f "$artifact"
          mkdir -p core/dist
          cp "$artifact" "$dist"
          echo "CRSQLITE_ARTIFACT=$artifact" >> "$GITHUB_ENV"

      - name: Inspect the extension
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)
              nm -D --defined-only "$CRSQLITE_ARTIFACT" |
                grep sqlite3_crsqlite_init
              if ldd "$CRSQLITE_ARTIFACT" | grep -i libsqlite; then
                echo "The extension unexpectedly links SQLite" >&2
                exit 1
              fi
              ;;
            macOS)
              nm -gU "$CRSQLITE_ARTIFACT" |
                grep _sqlite3_crsqlite_init
              if otool -L "$CRSQLITE_ARTIFACT" | tail -n +2 |
                grep -i libsqlite; then
                echo "The extension unexpectedly links SQLite" >&2
                exit 1
              fi
              ;;
          esac

      - name: Exercise CRR behavior through SQLite
        shell: bash
        run: |
          output=$(sqlite3 :memory: <<SQL
          .bail on
          .load $CRSQLITE_ARTIFACT sqlite3_crsqlite_init
          CREATE TABLE foo (id INTEGER PRIMARY KEY NOT NULL, value TEXT);
          SELECT crsql_as_crr('foo');
          INSERT INTO foo VALUES (1, 'alice');
          SELECT count(*) FROM crsql_changes;
          SELECT crsql_finalize();
          SQL
          )

          printf '%s\n' "$output" | grep -qx 1

      - name: Run Rust tests
        run: |
          cargo test -p crsql_core --features loadable_extension --locked
          cargo test -p crsql_fractindex_core \
            --features loadable_extension \
            --locked

      - name: Install Python test dependencies
        run: python -m pip install -r py/correctness/requirements.txt

      - name: Run Python correctness tests
        working-directory: py/correctness
        run: python -m pytest tests
