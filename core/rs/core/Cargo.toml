[package]
name = "crsql_core"
version = "0.1.0"
edition = "2021"
authors = ["Matt Wonlaw"]
keywords = ["sqlite", "cr-sqlite", "crdt"]
license = "Apache 2"

[lib]
name = "crsql_core"
crate-type = ["rlib"]

[dependencies]
sqlite_nostd = { path = "../sqlite-rs-embedded/sqlite_nostd" }
# cr-sqlite 0.16.3's correctness suite is incompatible with newer 1.x
# releases of bytes.
bytes = { version = "=1.5.0", default-features = false }
num-traits = { version = "0.2.17", default-features = false }
num-derive = "0.4.1"

[dev-dependencies]

[features]
test = []
libsql = []
loadable_extension = ["sqlite_nostd/loadable_extension"]
static = ["sqlite_nostd/static"]
omit_load_extension = ["sqlite_nostd/omit_load_extension"]
